# Database connections — committed to version control.
# Passwords go in databases.secrets.toml (gitignored); usernames live here.
#
# Supported drivers: postgres, mongodb, surrealdb, couchdb, sqlite
# All [[database]] entries are equal-standing — writes fan out to all, reads are merged.
#
# Override file paths via env vars:
#   DATABASES_TOML         (default: databases.toml)
#   DATABASES_SECRETS_TOML (default: databases.secrets.toml)
# Fallback when this file is absent: DB_URLS or DATABASE_URL env vars.

[[database]]
id     = "postgres_supabase"
username = "postgres.peiabfabxjrxaadvsxxw"
driver = "postgres"
host   = "aws-0-eu-west-1.pooler.supabase.com"
port   = 5432
dbname = "postgres"

[[database]]
