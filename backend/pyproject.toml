[project]
name = "comrev-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "strawberry-graphql[fastapi]>=0.240.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
