[project]
name = "structable-agents"
version = "0.1.0"
description = "LangGraph agent backend for Structable CopilotKit integration"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-anthropic>=1.4,<2",
  "langchain-ollama>=0.3,<1",
  "langchain-core>=1.2,<2",
  "copilotkit>=0.1.93,<0.2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "fastapi>=0.115,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["structable_agent"]
