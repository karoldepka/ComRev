[project]
name = "comrev"
version = "0.1.0"
description = ""
authors = [{ name = "you" }]
requires-python = ">=3.13"

dependencies = [
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "tenacity>=8.3,<9.0",
  "python-dotenv>=1.2.2,<2.0",
  "gitpython>=3.1.49,<4.0",
]

[tool.black]
line-length = 80
target-version = ["py313"]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"

